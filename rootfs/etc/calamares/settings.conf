# settings.conf on Debian penguins-eggs 26.7.29
---
modules-search:
  - local
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
instances:
  - id: mkinitramfs
    module: shellprocess
    config: shellprocess@mkinitramfs.conf
  - id: boot_deploy
    module: shellprocess
    config: shellprocess@boot_deploy.conf
  - id: boot_reconfigure
    module: shellprocess
    config: shellprocess@boot_reconfigure.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - dpkg-unsafe-io
      - sources-yolk
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - luksbootkeyfile
      - shellprocess@boot_deploy
      - initramfscfg
      - shellprocess@mkinitramfs
      - bootloader-config
      - grubcfg
      - bootloader
      - shellprocess@boot_reconfigure
      - plymouthcfg
      - packages
      - dpkg-unsafe-io-undo
      - removeuser
      - sources-yolk-undo
      - cleanup
      - umount
  - show:
      - finished
branding: linexia
prompt-install: false
dont-chroot: false
