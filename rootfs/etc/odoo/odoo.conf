[options]
http_interface = 0.0.0.0
http_port = 8069
; Default master password shipped in the ISO — change it after installation.
admin_passwd = admin
db_user = odoo
list_db = True
addons_path = /opt/odoo/odoo-server/addons,/opt/odoo/odoo-server/odoo/addons
logfile = /var/log/odoo/odoo.log
workers = 0
limit_time_real = 1200
limit_time_cpu = 1200
max_cron_threads = 1
log_level = debug

[colors]
pid = never
loglevel = auto
session_id = never
http_request_line = auto
http_response_body = auto
perf = auto
cursor_mode = auto

